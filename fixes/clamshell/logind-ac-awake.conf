# AC-awake outside a session (caelestia-ryoku fixes/clamshell, fix 19).
# Installed to /etc/systemd/logind.conf.d/20-ryoku-fixes-lid-ac.conf; it sorts
# after Ryoku's 10-ryoku-lid.conf, so this value wins.
#
# Inside a session ryoku-clamshell's inhibitor owns the lid and the AC-awake
# wrapper already keeps it awake on AC. This covers the login screen, logout,
# and boot, where logind decides alone. On battery it still suspends.
[Login]
HandleLidSwitchExternalPower=ignore
